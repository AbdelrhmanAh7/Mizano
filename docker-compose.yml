version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mizano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mizano
      POSTGRES_PASSWORD: mizano_secret
      POSTGRES_DB: mizano_db
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1g
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizano -d mizano_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mizano-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256m
    command: redis-server --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ocr-service:
    profiles:
      - ocr
    build:
      context: ocr-service
      dockerfile: Dockerfile
    container_name: mizano-ocr
    restart: unless-stopped
    ports:
      - '7001:7001'
    environment:
      - OCR_SERVICE_PORT=7001
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7001/api/health']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  vlm-service:
    profiles:
      - vlm
    build:
      context: services/vlm-service
      dockerfile: Dockerfile
      args:
        INSTALL_VLLM: "false"
    container_name: mizano-vlm
    restart: unless-stopped
    ports:
      - '8100:8100'
    environment:
      - MODEL_NAME=Qwen/Qwen2.5-VL-7B-Instruct-AWQ
      - DEVICE=cuda
      - MAX_NEW_TOKENS=4096
      - TEMPERATURE=0.1
      - HOST=0.0.0.0
      - PORT=8100
      - LOG_LEVEL=info
      - VLM_MOCK=false
      - MAX_IMAGE_RESOLUTION=1280
    volumes:
      - vlm_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'python3', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8100/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

volumes:
  postgres_data:
  redis_data:
  vlm_models:
