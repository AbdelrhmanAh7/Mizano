version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mizano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mizano
      POSTGRES_PASSWORD: mizano_secret
      POSTGRES_DB: mizano_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizano -d mizano_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mizano-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
