# Mizano ERP - Railway Configuration
# ===================================
# Railway auto-deploys from this configuration file
# See: https://docs.railway.app/reference/config-as-code

# API Service
[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Environment variables are set in Railway dashboard
# Required secrets:
# - DATABASE_URL
# - REDIS_URL
# - JWT_SECRET
# - JWT_REFRESH_SECRET

# For the web service, create a separate service in Railway
# with the following configuration:
# [build]
# builder = "DOCKERFILE"
# dockerfilePath = "apps/web/Dockerfile"
#
# [deploy]
# numReplicas = 1
# healthcheckPath = "/"
# healthcheckTimeout = 300
