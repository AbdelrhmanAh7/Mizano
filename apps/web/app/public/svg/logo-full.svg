<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#085041"/>
    </linearGradient>
  </defs>
  <!-- Icon: Stylized "M" ledger/balance mark -->
  <g transform="translate(12, 8)">
    <!-- Rounded square background -->
    <rect width="64" height="64" rx="14" fill="url(#mg)"/>
    <!-- Stylized M formed by ledger lines + balance concept -->
    <path d="M16 48 L16 22 L32 36 L48 22 L48 48" 
          fill="none" stroke="#FFFFFF" stroke-width="3.5" 
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Balance dot (golden accent) -->
    <circle cx="32" cy="18" r="4" fill="#EF9F27"/>
    <!-- Ledger lines -->
    <line x1="16" y1="48" x2="48" y2="48" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="54" x2="44" y2="54" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  </g>
  <!-- Wordmark -->
  <text x="90" y="42" font-family="'Instrument Sans', 'DM Sans', 'Nunito Sans', system-ui, sans-serif" 
        font-size="32" font-weight="700" letter-spacing="-0.5" fill="#2C2C2A">mizano</text>
  <text x="91" y="60" font-family="'Instrument Sans', 'DM Sans', 'Nunito Sans', system-ui, sans-serif" 
        font-size="12" font-weight="500" letter-spacing="3.5" fill="#5F5E5A" text-transform="uppercase">ERP</text>
</svg>