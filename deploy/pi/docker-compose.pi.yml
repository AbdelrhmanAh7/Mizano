# Mizano on Raspberry Pi 5 (8GB, arm64). Unverified until run on a Pi.
# Usage: docker compose -f docker-compose.pi.yml --env-file .env.pi up -d
# No ports are published: cloudflared reaches web/api over the internal network.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

name: mizano

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mizano}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mizano_db}
    command:
      - postgres
      - -c
      - shared_buffers=384MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    volumes:
      - ${MIZANO_DATA_DIR:-/mnt/ssd/mizano}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 256m
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '192mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - ${MIZANO_DATA_DIR:-/mnt/ssd/mizano}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    networks: [internal]

  # One-shot: applies pending Prisma migrations, then exits 0.
  migrate:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: 'no'
    mem_limit: 768m
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  api:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: unless-stopped
    mem_limit: 1024m
    environment:
      NODE_ENV: production
      API_PORT: '6001'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      FRONTEND_URL: ${CORS_ORIGIN:?set CORS_ORIGIN}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN_CREDENTIAL_ROTATED_AT: ${TELEGRAM_BOT_TOKEN_CREDENTIAL_ROTATED_AT:-}
      CLOUDFLARE_TUNNEL_TOKEN_CREDENTIAL_ROTATED_AT: ${CLOUDFLARE_TUNNEL_TOKEN_CREDENTIAL_ROTATED_AT:-}
      INTAKE_STORAGE_DIR: /data/originals
      # Only cloudflared and the web server (it signs in for the browser and passes the browser's
      # address on) may set X-Forwarded-For (login throttling keys on it); loopback is built in.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.184.250/32,172.30.184.251/32}
      # Sign-ins and sign-ups per client address per minute (default 5).
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-5}
      # FlowLine connector: encrypts webhook signing secrets. Optional; without it the
      # "Connect to FlowLine" screen warns and refuses to save webhooks (API keys still work).
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
    volumes:
      - ${MIZANO_DATA_DIR:-/mnt/ssd/mizano}/originals:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:6001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks: [internal]

  worker:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: unless-stopped
    init: true
    mem_limit: 2048m
    memswap_limit: 2048m
    cpus: 2.0
    pids_limit: 128
    # Lets an in-flight document finish; an interrupted one is reclaimed after its lease.
    stop_grace_period: 30s
    working_dir: /app/apps/api
    command: ['node', '--max-old-space-size=1536', 'dist/intake-worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: '3'
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-}
      # The intake worker opens the organization's sealed AI key to read a bill with its own account.
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      INTAKE_STORAGE_DIR: /data/originals
      INTAKE_CONCURRENCY: ${INTAKE_CONCURRENCY:-1}
    volumes:
      # The worker only reads originals; the api writes them.
      - ${MIZANO_DATA_DIR:-/mnt/ssd/mizano}/originals:/data/originals:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No HTTP server: a fresh heartbeat file proves the database and queue are reachable.
      test: ['CMD', 'node', 'dist/intake-worker-healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks: [internal]

  web:
    image: ${MIZANO_WEB_IMAGE:?set MIZANO_WEB_IMAGE}
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '5001'
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      API_INTERNAL_URL: http://api:6001/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5001/robots.txt']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks:
      internal:
        # Fixed so the api can trust exactly this peer for X-Forwarded-For (TRUSTED_PROXY_CIDRS).
        ipv4_address: 172.30.184.251

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    mem_limit: 128m
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    networks:
      internal:
        # Fixed so the api can trust exactly this peer (TRUSTED_PROXY_CIDRS).
        ipv4_address: 172.30.184.250

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.184.0/24
