# Only cloudflared reaches this listener; never publish it on the host.
# Every request arrives from the cloudflared container, so this limit is shared by
# all users. Hashed static assets are exempt: a cold Next.js page load plus link
# prefetches can exceed a small burst, and a 429 on a JS chunk breaks the page.
limit_req_zone $binary_remote_addr zone=ingress:10m rate=20r/s;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    server_name _;
    # Re-resolve peers after image upgrades/rollbacks replace container IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:6001;
    set $web_upstream http://web:5001;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 25m;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    location /socket.io/ {
        limit_req zone=ingress burst=60 nodelay;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    # Do not expose diagnostics or the historical Colab webhook.
    location ~ ^/api/(docs(?:-json|-yaml)?|internal|health)(/|$) { return 404; }
    # NextAuth owns only these paths; Nest owns auth/login, register, refresh,
    # logout, etc. Keep /api as the public base for the existing realtime clients.
    location ~ ^/api/auth/(csrf|session|providers|signin|signout|callback|error)(/|$) {
        limit_req zone=ingress burst=60 nodelay;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        limit_req zone=ingress burst=60 nodelay;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /_next/static/ {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        limit_req zone=ingress burst=120 nodelay;
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
