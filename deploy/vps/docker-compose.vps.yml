# Jarda on one Ubuntu 24.04 VPS (sized for Contabo Cloud VPS 20: 6 vCPU / 12 GB).
# Started by deploy/vps/install.sh; by hand:
#   docker compose -f deploy/vps/docker-compose.vps.yml --env-file /etc/jarda/jarda.env up -d
# Only Caddy publishes ports (80/443). Postgres, Redis, the API and the web app stay on the
# internal network. Docker-published ports bypass ufw, so never add `ports:` to another service.
# Other products (FlowLine) add services through /etc/jarda/compose.d/*.yml and their HTTPS site
# through /etc/jarda/caddy-sites/*.caddy; scripts/compose.sh merges them (see README, section 9).

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

name: jarda

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 3g
    shm_size: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jarda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jarda}
    command:
      - postgres
      - -c
      - shared_buffers=768MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=60
    volumes:
      - ${MIZANO_DATA_DIR:-/srv/jarda}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 512m
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '384mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes:
      - ${MIZANO_DATA_DIR:-/srv/jarda}/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging
    networks: [internal]

  # One-shot: applies pending Prisma migrations, then exits 0. api/worker start only after it.
  migrate:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: 'no'
    mem_limit: 768m
    working_dir: /app/apps/api
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks: [internal]

  api:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: unless-stopped
    mem_limit: 2g
    environment:
      NODE_ENV: production
      API_PORT: '6001'
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      FRONTEND_URL: ${CORS_ORIGIN:?set CORS_ORIGIN}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_TOKEN_CREDENTIAL_ROTATED_AT: ${TELEGRAM_BOT_TOKEN_CREDENTIAL_ROTATED_AT:-}
      INTAKE_STORAGE_DIR: /data/originals
      # Only Caddy and the web server (it signs in for the browser and passes the browser's
      # address on) may set X-Forwarded-For (login throttling keys on it); loopback is built in.
      TRUSTED_PROXY_CIDRS: 172.30.185.250/32,172.30.185.251/32
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-5}
      # Seals webhook secrets and each organization's own AI key. Generated by install.sh.
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:?set INTEGRATIONS_ENCRYPTION_KEY}
      # Optional email (password reset links, invoices to customers), e.g. Resend's free SMTP:
      # MAIL_SMTP_HOST=smtp.resend.com, MAIL_SMTP_PORT=587, MAIL_SMTP_USER=resend, a key as password.
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - ${MIZANO_DATA_DIR:-/srv/jarda}/originals:/data/originals
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:6001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks: [internal]

  worker:
    image: ${MIZANO_API_IMAGE:?set MIZANO_API_IMAGE}
    restart: unless-stopped
    init: true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    pids_limit: 128
    # Lets an in-flight document finish; an interrupted one is reclaimed after its lease.
    stop_grace_period: 30s
    working_dir: /app/apps/api
    command: ['node', '--max-old-space-size=1536', 'dist/intake-worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      DATABASE_POOL_SIZE: '3'
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AI_OLLAMA_BASE_URL: ${AI_OLLAMA_BASE_URL:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:?set INTEGRATIONS_ENCRYPTION_KEY}
      INTAKE_STORAGE_DIR: /data/originals
      INTAKE_CONCURRENCY: ${INTAKE_CONCURRENCY:-2}
    volumes:
      # The worker only reads originals; the api writes them.
      - ${MIZANO_DATA_DIR:-/srv/jarda}/originals:/data/originals:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # No HTTP server: a fresh heartbeat file proves the database and queue are reachable.
      test: ['CMD', 'node', 'dist/intake-worker-healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks: [internal]

  web:
    image: ${MIZANO_WEB_IMAGE:?set MIZANO_WEB_IMAGE}
    restart: unless-stopped
    mem_limit: 1g
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '5001'
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      API_INTERNAL_URL: http://api:6001/api
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:5001/robots.txt']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging
    networks:
      internal:
        # Fixed so the api can trust exactly this peer for X-Forwarded-For (TRUSTED_PROXY_CIDRS).
        ipv4_address: 172.30.185.251

  # HTTPS for both hostnames. Certificates come from Let's Encrypt automatically on first start
  # (DNS A records must already point at this server and ports 80/443 must be open).
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    environment:
      JARDA_WEB_HOST: ${JARDA_WEB_HOST:?set JARDA_WEB_HOST}
      JARDA_API_HOST: ${JARDA_API_HOST:?set JARDA_API_HOST}
      # Let's Encrypt contact email; `internal` (self-signed) only for the local scratch drill.
      CADDY_TLS: ${CADDY_TLS:-${ACME_EMAIL:?set ACME_EMAIL}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${JARDA_CADDY_SITES_DIR:-/etc/jarda/caddy-sites}:/etc/caddy/sites:ro
      - ${MIZANO_DATA_DIR:-/srv/jarda}/caddy/data:/data
      - ${MIZANO_DATA_DIR:-/srv/jarda}/caddy/config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging
    networks:
      internal:
        ipv4_address: 172.30.185.250

networks:
  internal:
    driver: bridge
    ipam:
      config:
        # Not the Pi subnet (172.30.184.0/24), so both stacks can run side by side on one host.
        - subnet: 172.30.185.0/24
