# Mizano ERP - Continuous Integration Pipeline
# =============================================
# Runs on all PRs and pushes to master/develop branches.
# Optimized: shared pnpm cache, parallel jobs, no redundant installs.
# The multi-arch Docker validation only runs on branch pushes, relevant PR changes, or the
# "docker" label. It never publishes images; deploy.yml owns publishing.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    # "labeled" lets an operator start CI on a draft ("ci" label) or request the Docker
    # validation ("docker" label) without a new commit. The gate job ignores other labels.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

# One run per PR (or per pushed branch). A newer PR run replaces the older one as a whole,
# including the expensive Docker job. An unrelated label never cancels a running CI, and
# branch pushes are queued instead of cancelled so every master commit keeps a complete
# result (deploy.yml starts from the CI result of master).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'ci' || github.event.label.name == 'docker') }}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ==========================================
  # Gate: decide whether CI runs for this event
  # ==========================================
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether CI should run
        id: check
        # Event data reaches the script through env vars only, never through ${{ }} in the
        # script body, so a label name cannot inject shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci') }}
          ADDED_LABEL: ${{ github.event.label.name }}
        run: |
          should_run=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$EVENT_ACTION" = "labeled" ] && [ "$ADDED_LABEL" != "ci" ] && [ "$ADDED_LABEL" != "docker" ]; then
              echo "The added label does not control CI - skipping"
              should_run=false
            elif [ "$IS_DRAFT" = "true" ] && [ "$HAS_CI_LABEL" != "true" ]; then
              echo "Draft PR without the 'ci' label - skipping CI"
              should_run=false
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Path filter: detect docker-relevant changes
  # ==========================================
  filter:
    name: Path Filter
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    # paths-filter lists the changed files of a PR through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker-changed: ${{ steps.filter.outputs.docker-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker-changed:
              - 'apps/api/Dockerfile'
              - 'apps/web/Dockerfile'
              - '.dockerignore'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'

  # ==========================================
  # Install & Cache Dependencies (shared)
  # ==========================================
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # ==========================================
  # Lint & Type Check (after install)
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      # Restores here and saves after the job succeeds, so the cache holds what the Turbo
      # tasks below produced. Each job has its own key prefix: the tasks differ per job.
      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      # A task `inputs` list that skips a source directory (apps/web has no src/) makes
      # the cache above replay stale results.
      - name: Check turbo task inputs
        run: python3 -m unittest discover -s scripts -p 'test_turbo_config.py'

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm turbo run type-check

  # ==========================================
  # Unit Tests (parallel with lint)
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mizano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Push database schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
          NODE_ENV: test

  # ==========================================
  # Build (parallel with lint and test)
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  # ==========================================
  # Docker Multi-Arch Build (conditional, validation only)
  # Runs only after lint, test and build passed, and only on:
  #   - push to master or develop
  #   - PRs with docker-relevant file changes
  #   - PRs with the "docker" label
  # One matrix leg per architecture, each on a native runner, because QEMU emulation of the
  # arm64 build never finished: `pnpm install` made no progress for 60 minutes (amd64 took
  # 44 seconds). Nothing is pushed: deploy.yml owns the published images, and the web image
  # bakes NEXT_PUBLIC_API_URL in at build time, so an image built here with a placeholder
  # URL must not be tagged for deployment.
  # ==========================================
  docker-build:
    name: Docker Multi-Arch Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [gate, filter, lint, test, build]
    if: >-
      needs.gate.outputs.should_run == 'true' &&
      (github.event_name == 'push' ||
      needs.filter.outputs.docker-changed == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'docker'))
    strategy:
      # Both architectures report their own result; an amd64 failure must not hide arm64.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          # Native arm64 runner, free for public repositories.
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Every image and architecture has its own cache scope; a shared scope makes the
      # next build overwrite the cache of the previous one.
      - name: Build API image (${{ matrix.arch }}, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Build Web image (${{ matrix.arch }}, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
