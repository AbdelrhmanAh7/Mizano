# Mizano ERP - Continuous Integration Pipeline
# =============================================
# Runs on all PRs and on pushes to the default branch (master), on GitHub-hosted runners only (ubuntu-latest, free and
# unlimited for this public repository). No self-hosted labels and no secrets beyond the automatic GITHUB_TOKEN.
#
# Owner rule: every job stays under 5 minutes (timeout-minutes: 5), so the pipeline is split into parallel jobs.
# The job names are the check names the hub gates and automerge wait for ("Install Dependencies", "Lint & Type Check",
# "Unit Tests", "Build"): keep them stable. Jobs are independent and each installs from the shared pnpm store cache
# (setup-node), so none waits for another and a failed install cannot skip the others silently.
#
# Fork PRs: this workflow uses `pull_request` (read-only token, no secrets), never `pull_request_target`; first-time
# fork contributors need an approval in the repository settings before it runs. Leave that setting on.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

# A newer push to the same PR cancels the older run; pushes to master are never cancelled, so every master head gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  docs-check:
    name: docs-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test documentation guard offline
        shell: bash
        run: python3 .github/tests/test_docs_check.py

      - name: Require documentation or an explained exemption
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          changed_files="$(mktemp)"
          trap 'rm -f "$changed_files"' EXIT

          git diff --name-only --no-renames -z "$BASE_SHA" "$HEAD_SHA" -- apps/ packages/ deploy/ .github/ > "$changed_files"
          if [[ ! -s "$changed_files" ]]; then
            echo 'No changes in documentation-gated paths.'
            exit 0
          fi

          # Deleting a Markdown file alone does not update documentation.
          git diff --name-only --no-renames --diff-filter=ACMRT -z "$BASE_SHA" "$HEAD_SHA" -- '*.md' > "$changed_files"
          if [[ -s "$changed_files" ]]; then
            echo 'Markdown documentation updated; reviewers must check relevance and freshness.'
            exit 0
          fi

          exemption_pattern=$'(^|\n)Docs: not needed because'
          if [[ "${PR_BODY:-}" =~ $exemption_pattern ]]; then
            echo 'Documentation exemption supplied; reviewers must assess the explanation.'
            exit 0
          fi

          echo '::error::Update every affected .md file in this PR, or add a PR-body line starting with "Docs: not needed because" and explain why.'
          exit 1

  # ==========================================
  # Install: the lockfile installs and the Prisma client generates
  # ==========================================
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

  # ==========================================
  # Lint & Type Check
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm turbo run type-check

  # ==========================================
  # Unit Tests (mock-only: no database, no Redis)
  # ==========================================
  # Every unit test mocks Prisma and Redis (apps/api/src/test/mocks); the suites pass with an unreachable DATABASE_URL, so
  # the job needs no service containers and no `db:push` (slim-down 2026-10-10, docs/slimdown-plan.md). The real-database
  # API e2e specs run in nightly.yml.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run unit tests
        run: pnpm test
        env:
          # Placeholders only: nothing connects (unit tests are mock-only).
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          REDIS_URL: redis://127.0.0.1:1
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
          NODE_ENV: test

  # ==========================================
  # Build
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Next.js build cache (webpack/SWC artefacts only, never the build output): a warm cache lets `next build` skip
      # recompiling unchanged modules. PR runs restore the newest cache saved by master.
      # Keyed on the lockfile plus the web sources, falling back to the newest cache for the same lockfile.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
