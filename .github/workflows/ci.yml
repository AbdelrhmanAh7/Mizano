# Mizano ERP - Continuous Integration Pipeline
# =============================================
# Runs on all PRs and pushes to master/develop branches.
# Optimized: shared pnpm cache, parallel jobs, no redundant installs.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==========================================
  # Install & Cache Dependencies (shared)
  # ==========================================
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # ==========================================
  # Lint & Type Check (after install)
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm turbo run type-check

  # ==========================================
  # Unit Tests (parallel with lint)
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mizano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Push database schema
        run: pnpm db:push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test

      - name: Run unit tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
          NODE_ENV: test

  # ==========================================
  # Build (parallel with lint and test)
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            apps/api/src/generated
          key: modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com

  # ==========================================
  # Docker Multi-Architecture Build
  # ==========================================
  docker-multiarch:
    name: Docker Multi-Arch Build (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: mizano-api:${{ matrix.arch }}
          cache-from: type=gha,scope=api-multiarch
          cache-to: type=gha,mode=max,scope=api-multiarch

      - name: Build Web image for amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: mizano-web:${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com/api
          cache-from: type=gha,scope=web-multiarch
          cache-to: type=gha,mode=max,scope=web-multiarch

      - name: Verify target binaries, offline Prisma CLI and image sizes
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          for image in mizano-api mizano-web; do
            actual=$(docker run --rm --network none --platform "linux/$TARGET_ARCH" --entrypoint node "$image:$TARGET_ARCH" -p process.arch)
            expected="$TARGET_ARCH"
            if [ "$expected" = amd64 ]; then expected=x64; fi
            test "$actual" = "$expected"
          done
          docker run --rm --network none --platform "linux/$TARGET_ARCH" --entrypoint node "mizano-api:$TARGET_ARCH" -e "require('bcrypt'); require('sharp'); require('@prisma/client')"
          docker run --rm --network none --platform "linux/$TARGET_ARCH" --entrypoint node "mizano-web:$TARGET_ARCH" -e "require('sharp')"
          docker run --rm --network none --platform "linux/$TARGET_ARCH" -e DATABASE_URL=postgresql://validation:validation@127.0.0.1:5432/validation "mizano-api:$TARGET_ARCH" npx --no-install prisma validate
          docker run --rm --network none --platform "linux/$TARGET_ARCH" --entrypoint node "mizano-api:$TARGET_ARCH" -e "require('tesseract.js').createWorker('eng+ara').then(worker => worker.terminate()).catch(() => process.exit(1))"
          docker image ls
          api_size=$(docker image inspect --format '{{.Size}}' "mizano-api:$TARGET_ARCH")
          web_size=$(docker image inspect --format '{{.Size}}' "mizano-web:$TARGET_ARCH")
          echo "mizano-api:$TARGET_ARCH = $api_size bytes (limit 1000000000)"
          echo "mizano-web:$TARGET_ARCH = $web_size bytes (limit 500000000)"
          test "$api_size" -lt 1000000000
          test "$web_size" -lt 500000000
