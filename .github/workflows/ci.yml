# Mizano ERP - Continuous Integration Pipeline
# =============================================
# Runs on all PRs and pushes to master/develop branches on GitHub-hosted runners only (free and
# unlimited for this public repository). No self-hosted labels and no secrets beyond the automatic GITHUB_TOKEN.
#
# Owner rule: every job stays under 5 minutes (timeout-minutes: 5), so the pipeline is split into parallel jobs.
# The job names are the check names the hub gates and automerge wait for ("Install Dependencies", "Lint & Type Check",
# "Unit Tests", "Build"): keep them stable. Jobs are independent and each installs from the shared pnpm store cache
# (setup-node), so none waits for another and a failed install cannot skip the others silently.
#
# Fork PRs: this workflow uses `pull_request` (read-only token, no secrets), never `pull_request_target`; first-time
# fork contributors need an approval in the repository settings before it runs. Leave that setting on.
#
# Optimized: shared pnpm cache, parallel jobs, turbo cache via actions/cache, no redundant installs.

name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    # "labeled" lets an operator start CI on a draft ("ci" label) without a new commit.
    # Any label change re-runs the real jobs: a run whose jobs the gate skipped would report
    # under the same check names and hide a failing run of the same commit.
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

# One run per PR. A newer PR run replaces the older one as a whole.
# Branch pushes get one group per commit SHA: GitHub keeps only one pending run
# per group, so a shared group would drop the middle of two quick pushes. Per-SHA groups never
# cancel or replace each other, so every master commit keeps a complete result (deploy.yml
# starts from the CI result of master).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==========================================
  # Gate: decide whether CI runs for this event
  # ==========================================
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Decide whether CI should run
        id: check
        # Event data reaches the script through env vars only, never through ${{ }} in the
        # script body, so a label name cannot inject shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HAS_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci') }}
        run: |
          should_run=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$IS_DRAFT" = "true" ] && [ "$HAS_CI_LABEL" != "true" ]; then
            echo "Draft PR without the 'ci' label - skipping CI"
            should_run=false
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  # ==========================================
  # Install & Cache Dependencies (shared)
  # ==========================================
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

  # ==========================================
  # Lint & Type Check
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Restores here and saves after the job succeeds, so the cache holds what the Turbo
      # tasks below produced. Each job has its own key prefix: the tasks differ per job.
      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-lint-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      # Check turbo task inputs and CI configuration constraints (5-minute timeouts,
      # no cold docker-build jobs, least-privilege permissions, stable check names).
      - name: Check turbo task inputs and CI configuration
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript type check
        run: pnpm turbo run type-check

  # ==========================================
  # Unit Tests (mock-only: no database, no Redis)
  # ==========================================
  # Every unit test mocks Prisma and Redis (apps/api/src/test/mocks); the suites pass with an unreachable DATABASE_URL, so
  # the job needs no service containers and no `db:push` (slim-down 2026-10-10, docs/slimdown-plan.md). The real-database
  # API e2e specs run in nightly.yml.
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Run unit tests
        run: pnpm test
        env:
          # Placeholders only: nothing connects (unit tests are mock-only).
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          REDIS_URL: redis://127.0.0.1:1
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
          NODE_ENV: test

  # ==========================================
  # Build
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, install]
    if: needs.gate.outputs.should_run == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # Next.js build cache (webpack/SWC artefacts only, never the build output): a warm cache lets `next build` skip
      # recompiling unchanged modules. PR runs restore the newest cache saved by master.
      # Keyed on the lockfile plus the web sources, falling back to the newest cache for the same lockfile.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/app/**', 'apps/web/components/**', 'apps/web/lib/**', 'apps/web/messages/**', 'packages/*/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Cache turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}-

      - name: Build all packages
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
