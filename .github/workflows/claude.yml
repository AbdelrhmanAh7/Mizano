# Claude on GitHub (Anthropic's claude-code-action) running on the owner's Claude subscription (Max) via a long-lived
# OAuth token - no API billing. Two jobs:
#   claude  - answers "@claude" in issue comments, PR review comments, PR reviews and new issues (interactive/tag mode)
#   review  - strict review of every PR opened/updated from a branch of THIS repo, kept in one sticky comment
# Inert until the repo secret CLAUDE_CODE_OAUTH_TOKEN exists (then the Mac mini hub responder - bin/mention.sh - stays the
# fallback and skips whatever this workflow already took). Setup, once per repo, by the owner on the Mac:
#   claude setup-token                                          (interactive; prints the token)
#   gh secret set CLAUDE_CODE_OAUTH_TOKEN -R <owner>/<repo>     (paste the token when prompted)
# The Claude GitHub App (https://github.com/apps/claude) must be installed on the repo: the action trades the job's OIDC
# token for an app token (hence id-token: write); the app itself is free, usage is billed to the subscription.
# Fork PRs never run: `pull_request` (not pull_request_target) gets no secrets, and the gate below refuses PR comment
# events whose head repo is not this repo. Source: nql-agents/templates/claude.yml (installed by scripts/install-claude-action.sh).
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    # Cheap pre-filter so runners only start for a real @claude mention from a human.
    if: >-
      github.event_name != 'pull_request' && github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-mention-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    env:
      # Secrets cannot be used in `if:`; a job-level env copy can. Empty secret (not set, or a fork/Dependabot run) -> 'false'.
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Gate (token present, writer, not a fork PR)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          PR_NUMBER: ${{ (github.event.issue.pull_request && github.event.issue.number) || github.event.pull_request.number }}
        run: |
          set -euo pipefail
          skip() { echo "::notice::$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$HAS_TOKEN" = "true" ] || skip "CLAUDE_CODE_OAUTH_TOKEN is not set - no-op (the Mac mini hub responder answers instead)."
          perm="$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo none)"
          case "$perm" in admin|maintain|write) ;; *) skip "$ACTOR has no write access - ignored." ;; esac
          if [ -n "$PR_NUMBER" ]; then
            head_repo="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name // ""')"
            [ "$head_repo" = "$REPO" ] || skip "PR #$PR_NUMBER does not come from a branch of this repo (fork) - never run."
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # Marker for the hub responder: an "eyes" reaction by github-actions[bot] on the mention = "the Action has this one".
      - name: Mark mention as taken by the Action
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          case "$EVENT" in
            issue_comment)               gh api -X POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null ;;
            pull_request_review_comment) gh api -X POST "repos/$REPO/pulls/comments/$COMMENT_ID/reactions" -f content=eyes >/dev/null ;;
            issues)                      gh api -X POST "repos/$REPO/issues/$ISSUE_NUMBER/reactions" -f content=eyes >/dev/null ;;
            *) echo "no reaction endpoint for $EVENT (the hub falls back to the claude[bot] tracking comment)" ;;
          esac

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1

      - name: Claude (interactive)
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 30

  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true # a newer push supersedes the review in flight
    permissions:
      contents: read # review only: the job never pushes (the docs' own review example uses read)
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Gate (token present)
        id: gate
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set - review is a no-op."; echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 1

      - name: Claude (PR review, sticky comment)
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true     # tag mode on pull_request events: one tracking comment ...
          use_sticky_comment: true # ... reused (updated in place) on every push instead of a new comment per run
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            You are a strict senior reviewer. Review ONLY what this pull request changes: read `gh pr diff` and open the
            changed files for context. This is an accounting/ERP app: money must never use floating point, double-entry postings must balance, VAT/e-invoice rules and tenant isolation/auth checks on every endpoint matter.

            Rules
            - Report real problems only: bugs, security holes (secrets, authz, injection), data loss, money/rounding errors,
              broken or missing tests for risky logic, behaviour regressions, unsafe migrations or CI changes.
              No praise, no style nits, no restating the diff.
            - Every finding cites `path:line`, says what is wrong in one sentence and gives the smallest fix. Severity:
              blocker / major / minor.
            - Blocker and major findings go inline (mcp__github_inline_comment__create_inline_comment, confirmed: true).
              Minor ones are a short list in the summary. At most 8 findings in total. Be brief.
            - Review only. Do NOT edit files, commit or push.

            Your tracking comment (the one you update) must be exactly this shape, short:
            <!-- claude-action review sha=${{ github.event.pull_request.head.sha }} -->
            **Verdict:** APPROVE | CHANGES REQUESTED
            findings as a bullet list (`path:line` - severity - problem - fix), or "No blocking issues."
            **Summary (EN):** one or two sentences.
            **الملخص (AR):** the same summary in Arabic, one or two sentences.
          claude_args: |
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*),mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
