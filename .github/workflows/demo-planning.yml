name: Demo planning metadata

on:
  push:
    branches: [docs/cpu-demo-strategy-2026-09]
    paths:
      - .github/workflows/demo-planning.yml
      - docs/planning/demo-plan.json
      - scripts/sync-demo-planning.py
      - scripts/test_sync_demo_planning.py
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mizano-demo-planning
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify planning code and manifest offline
        run: |
          python -m unittest discover -s scripts -p 'test_sync_demo_planning.py'
          python scripts/sync-demo-planning.py --validate
      - name: Reconcile labels, milestones, issues and optional Project
        env:
          GH_TOKEN: ${{ github.token }}
          MIZANO_PROJECT_TOKEN: ${{ secrets.MIZANO_PROJECT_TOKEN }}
        run: python scripts/sync-demo-planning.py --apply --output /tmp/mizano-planning-result.json
      - name: Preserve exact resource results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mizano-planning-result
          path: /tmp/mizano-planning-result.json
          if-no-files-found: warn
          retention-days: 14
