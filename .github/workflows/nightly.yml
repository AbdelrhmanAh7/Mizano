# Mizano ERP - Nightly tests
# ==========================
# Slow real-database suites kept out of the PR gate (owner rule: PR jobs stay under 5 minutes and mock-only).
# - API e2e: the 11 Nest e2e-specs in apps/api/test (money/ledger/tenancy, supertest against a seeded Postgres + Redis),
#   split into 6 jest shards (--shard=i/6) so each job, setup included, stays within the 5-minute job limit.
# - ollama-proxy: python unittest for services/ollama-proxy.
# Not a required check and never run on pull_request; a red nightly is a follow-up issue, not a merge blocker.
# Failures show in Actions > Nightly and GitHub notifies the user who last changed the cron schedule; nothing else alerts on them.
# Manual run: Actions > Nightly > Run workflow, or `gh workflow run nightly.yml --ref <branch>`.

name: Nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  api-e2e:
    name: API e2e (real DB) ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mizano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: Seed database
        run: pnpm db:seed

      - name: Run API e2e specs (shard ${{ matrix.shard }}/6)
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6

  ollama-proxy:
    name: ollama-proxy (python)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ollama-proxy/requirements.txt

      - name: Install proxy dependencies
        run: pip install -r services/ollama-proxy/requirements.txt

      - name: Run unit tests
        working-directory: services/ollama-proxy
        run: python -m unittest discover -s . -p "test_*.py"
