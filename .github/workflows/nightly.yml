# Mizano ERP - Nightly tests
# ==========================
# Slow real-database suites kept out of the PR gate (owner rule: PR jobs stay under 5 minutes and mock-only).
# - API e2e: the 11 Nest e2e-specs in apps/api/test (money/ledger/tenancy, supertest against a seeded Postgres + Redis).
# - ollama-proxy: python unittest for services/ollama-proxy.
# Not a required check and never run on pull_request; a red nightly is a follow-up issue, not a merge blocker.
# Manual run: Actions > Nightly > Run workflow, or `gh workflow run nightly.yml --ref <branch>`.

name: Nightly

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  api-e2e:
    name: API e2e (real DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mizano_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/mizano_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push database schema
        run: pnpm db:push

      - name: Seed database
        run: pnpm db:seed

      - name: Run API e2e specs
        run: pnpm test:e2e

  ollama-proxy:
    name: ollama-proxy (python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install proxy dependencies
        run: pip install fastapi httpx uvicorn

      - name: Run unit tests
        working-directory: services/ollama-proxy
        run: python -m unittest discover -s . -p "test_*.py"
