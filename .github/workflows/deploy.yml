# Mizano ERP - Kamatera VPS Deployment Pipeline
# ==============================================
# Builds Docker images, pushes to GHCR, and deploys to Kamatera VPS via SSH.
# Triggered on release publish or manual workflow dispatch.
#
# Required GitHub Secrets:
#   DEPLOY_HOST       - Server IP or hostname (185.247.117.157)
#   DEPLOY_USER       - SSH username (deploy)
#   DEPLOY_SSH_KEY    - Private SSH key for the deploy user
#   PRODUCTION_URL    - Public URL (http://185.247.117.157:5001)
#   API_URL           - Public API URL (http://185.247.117.157:6001/api)

name: Deploy to Production

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository }}-api
  WEB_IMAGE_NAME: ${{ github.repository }}-web

jobs:
  # ==========================================
  # Build and Push Docker Images to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_tag: ${{ steps.vars.outputs.tag }}
      web_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}

  # ==========================================
  # Deploy to Kamatera VPS via SSH
  # ==========================================
  deploy:
    name: Deploy to Kamatera
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "docker-compose.production.yml,apps/api/prisma/"
          target: /opt/mizano
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /opt/mizano
            export TAG=${{ needs.build-and-push.outputs.api_tag }}

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${TAG}
            docker pull ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${TAG}

            # Tag as latest locally
            docker tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${TAG} mizano-api:latest
            docker tag ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${TAG} mizano-web:latest

            # Rolling restart (images are pre-built from GHCR)
            docker compose -f docker-compose.production.yml up -d --no-deps api
            sleep 10
            docker compose -f docker-compose.production.yml up -d --no-deps web

            # Run database migrations
            docker exec mizano-api npx prisma migrate deploy --schema /app/apps/api/prisma/schema.prisma || true

            # Cleanup old images
            docker image prune -f

            echo "Deployment completed: tag=${TAG}"

  # ==========================================
  # Health check
  # ==========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Verify API health
        run: |
          for i in 1 2 3; do
            status=$(curl -sf -o /dev/null -w "%{http_code}" "http://${{ secrets.DEPLOY_HOST }}:6001/api/health" || true)
            if [ "$status" = "200" ]; then
              echo "API is healthy (attempt $i)"
              exit 0
            fi
            echo "Attempt $i failed (status: $status), retrying in 10s..."
            sleep 10
          done
          echo "API health check failed after 3 attempts"
          exit 1

      - name: Notify success
        if: success()
        run: echo "Deployment to Kamatera verified successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "Deployment verification FAILED at $(date)"
