# Mizano ERP - Kamatera VPS Deployment Pipeline
# ==============================================
# Builds Docker images, pushes to GHCR, and deploys to Kamatera VPS via SSH.
# Triggered on push/merge to master, release publish, or manual dispatch.
#
# Required GitHub Secrets:
#   DEPLOY_HOST       - Server IP or hostname (185.247.117.157)
#   DEPLOY_USER       - SSH username (deploy)
#   DEPLOY_SSH_KEY    - Private SSH key for the deploy user
#   PRODUCTION_URL    - Public URL (http://185.247.117.157:5001)

name: Deploy to Production

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'
  REGISTRY: ghcr.io
  API_IMAGE_NAME: abdelrhmanah7/mizano-api
  WEB_IMAGE_NAME: abdelrhmanah7/mizano-web

jobs:
  # ==========================================
  # Build and Push Docker Images to GHCR
  # ==========================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_tag: ${{ steps.vars.outputs.tag }}
      web_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.DEPLOY_HOST }}:6001/api

  # ==========================================
  # Deploy to Kamatera VPS via SSH
  # ==========================================
  deploy:
    name: Deploy to Kamatera
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clean up server disk and prepare directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            echo "=== Disk before cleanup ==="
            df -h / | tail -1

            # Remove unused Docker resources (images, containers, networks) but KEEP volumes
            # to preserve database data between deployments
            docker system prune -af 2>/dev/null || true

            # Clean apt cache
            apt-get clean 2>/dev/null || true
            rm -rf /tmp/* 2>/dev/null || true

            # Clean old logs
            find /var/log -type f -name "*.gz" -delete 2>/dev/null || true
            journalctl --vacuum-size=50M 2>/dev/null || true

            echo "=== Disk after cleanup ==="
            df -h / | tail -1

            mkdir -p ~/mizano/apps/api/prisma

      - name: Copy deployment files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: "docker-compose.production.yml,apps/api/prisma/,nginx/"
          target: ~/mizano
          overwrite: true

      - name: Write .env on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          PG_USER: ${{ secrets.POSTGRES_USER || 'mizano' }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          PG_DB: ${{ secrets.POSTGRES_DB || 'mizano_db' }}
          JWT_S: ${{ secrets.JWT_SECRET }}
          JWT_RS: ${{ secrets.JWT_REFRESH_SECRET }}
          NA_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          PROD_URL: ${{ secrets.PRODUCTION_URL }}
          DH: ${{ secrets.DEPLOY_HOST }}
          OLLAMA_WH_SECRET: ${{ secrets.OLLAMA_WEBHOOK_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: PG_USER,PG_PASS,PG_DB,JWT_S,JWT_RS,NA_SECRET,PROD_URL,DH,OLLAMA_WH_SECRET
          script: |
            set -e
            mkdir -p ~/mizano

            # URL-encode password for DATABASE_URL (handle special chars like / = + $)
            PG_PASS_ENCODED=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ.get('PG_PASS',''), safe=''))" 2>/dev/null || printf '%s' "${PG_PASS}")

            # Write .env using printf to avoid heredoc shell expansion issues
            {
              echo "APP_ENV=prod"
              echo "NODE_ENV=production"
              echo "POSTGRES_USER=${PG_USER:-mizano}"
              printf 'POSTGRES_PASSWORD=%s\n' "${PG_PASS}"
              echo "POSTGRES_DB=${PG_DB:-mizano_db}"
              printf 'DATABASE_URL=postgresql://%s:%s@postgres:5432/%s?schema=public\n' "${PG_USER:-mizano}" "${PG_PASS_ENCODED}" "${PG_DB:-mizano_db}"
              echo "REDIS_URL=redis://redis:6379"
              printf 'JWT_SECRET=%s\n' "${JWT_S}"
              printf 'JWT_REFRESH_SECRET=%s\n' "${JWT_RS}"
              echo "JWT_EXPIRATION=15m"
              echo "JWT_REFRESH_EXPIRATION=7d"
              printf 'NEXTAUTH_SECRET=%s\n' "${NA_SECRET}"
              echo "NEXTAUTH_URL=${PROD_URL}"
              echo "API_PORT=6001"
              echo "CORS_ORIGIN=${PROD_URL}"
              echo "NEXT_PUBLIC_API_URL=http://${DH}:6001/api"
              echo "NEXT_PUBLIC_APP_NAME=Mizano"
              echo "RATE_LIMIT_TTL=1000"
              echo "RATE_LIMIT_MAX=30"
              echo "RATE_LIMIT_AUTH_MAX=10"
              echo "LOG_LEVEL=warn"
              echo "OLLAMA_BASE_URL=http://ollama-proxy:11434"
              echo "OLLAMA_ENABLED=true"
              echo "OLLAMA_TEXT_MODEL=qwen3-vl:8b"
              echo "OLLAMA_VISION_MODEL=qwen3-vl:8b"
              echo "OLLAMA_TIMEOUT_MS=300000"
              echo "OLLAMA_MAX_CONCURRENT=1"
              echo "OLLAMA_NUM_CTX=8192"
              echo "EXTRACTION_STRATEGY=vlm"
              printf 'OLLAMA_WEBHOOK_SECRET=%s\n' "${OLLAMA_WH_SECRET}"
            } > ~/mizano/.env

            echo ".env written successfully"
            grep -c "=" ~/mizano/.env | xargs -I{} echo "{} variables written"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd ~/mizano
            export TAG=${{ needs.build-and-push.outputs.api_tag }}

            # Load env vars for credential checks
            set -a
            source ~/mizano/.env 2>/dev/null || true
            set +a

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${TAG}
            docker pull ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${TAG}

            # Tag as latest locally
            docker tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${TAG} mizano-api:latest
            docker tag ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${TAG} mizano-web:latest

            # Start infra first (postgres, redis, ollama-proxy)
            docker compose -f docker-compose.production.yml up -d postgres redis ollama-proxy

            # Wait for postgres to be healthy (up to 60s)
            echo "Waiting for PostgreSQL to be ready..."
            for i in $(seq 1 12); do
              if docker exec mizano-postgres pg_isready -U "${POSTGRES_USER:-mizano}" 2>/dev/null; then
                echo "PostgreSQL is ready"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "ERROR: PostgreSQL failed to start"
                docker logs mizano-postgres --tail 20 2>&1 || true
                exit 1
              fi
              sleep 5
            done

            # Always sync the DB password to handle stale volume scenario
            # (PostgreSQL only reads POSTGRES_PASSWORD on first init, not on subsequent starts)
            echo "Syncing DB password to ensure credentials match..."
            docker exec mizano-postgres psql -U "${POSTGRES_USER:-mizano}" -d "${POSTGRES_DB:-mizano_db}" \
              -c "ALTER USER ${POSTGRES_USER:-mizano} WITH PASSWORD '${POSTGRES_PASSWORD}';" >/dev/null 2>&1 \
              || { echo "ERROR: Could not sync DB password"; docker logs mizano-postgres --tail 30 2>&1 || true; exit 1; }

            # Verify credentials via TCP with password (same auth path the API uses)
            if ! docker exec -e PGPASSWORD="${POSTGRES_PASSWORD}" mizano-postgres \
              psql -h localhost -U "${POSTGRES_USER:-mizano}" -d "${POSTGRES_DB:-mizano_db}" -c "SELECT 1" >/dev/null 2>&1; then
              echo "ERROR: DB TCP auth still failing after password sync"
              docker logs mizano-postgres --tail 30 2>&1 || true
              exit 1
            fi
            echo "DB credentials verified (TCP)"

            # Rolling restart app services
            docker compose -f docker-compose.production.yml up -d --no-deps api
            sleep 15
            docker compose -f docker-compose.production.yml up -d --no-deps web
            docker compose -f docker-compose.production.yml up -d --no-deps nginx

            # Run database migrations
            docker exec mizano-api npx prisma migrate deploy --schema /app/apps/api/prisma/schema.prisma || true

            # Seed database (idempotent — only creates data if missing)
            docker exec mizano-api npx prisma db seed --schema /app/apps/api/prisma/schema.prisma || true

            # Cleanup old images
            docker image prune -f

            echo "Deployment completed: tag=${TAG}"

      - name: Build and start ollama-proxy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/mizano

            # Build and start the ollama-proxy container
            docker compose -f docker-compose.production.yml build ollama-proxy
            docker compose -f docker-compose.production.yml up -d ollama-proxy

            echo "Ollama proxy started — waiting for Colab tunnel URL via webhook"

  # ==========================================
  # Health check (runs on server via SSH)
  # ==========================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Verify API health via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            for i in 1 2 3 4 5; do
              status=$(curl -sf -o /dev/null -w "%{http_code}" "http://localhost:6001/api/health" || true)
              if [ "$status" = "200" ]; then
                echo "API is healthy (attempt $i)"
                # Also show full health response
                curl -s "http://localhost:6001/api/health" | python3 -m json.tool 2>/dev/null || true
                exit 0
              fi
              echo "Attempt $i failed (status: $status), retrying in 15s..."
              # Show container status for debugging
              docker ps --format "table {{.Names}}\t{{.Status}}" | grep mizano || true
              sleep 15
            done
            echo "API health check failed after 5 attempts"
            echo "=== Container logs ==="
            docker logs mizano-api --tail 50 2>&1 || true
            exit 1

      - name: Notify success
        if: success()
        run: echo "Deployment to Kamatera verified successfully at $(date)"

      - name: Notify failure
        if: failure()
        run: echo "Deployment verification FAILED at $(date)"
