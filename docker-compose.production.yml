version: '3.8'

services:
  # ============================================
  # NestJS API
  # ============================================
  api:
    image: ${API_IMAGE:-mizano-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mizano-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6001:6001"
    environment:
      - NODE_ENV=production
      - API_PORT=6001
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      # Compose cannot URL-encode: the API encodes REDIS_PASSWORD into REDIS_URL (set REDIS_URL without credentials).
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5001}
      - FRONTEND_URL=${CORS_ORIGIN:-http://localhost:5001}
      - AI_OLLAMA_BASE_URL=${AI_OLLAMA_BASE_URL:-}
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mizano-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Next.js Web
  # ============================================
  web:
    image: ${WEB_IMAGE:-mizano-web:latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:6001/api}
    container_name: mizano-web
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:5001}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:6001/api}
      - API_INTERNAL_URL=http://api:6001/api
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mizano-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: mizano-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_USER=${POSTGRES_USER:-mizano}
      - POSTGRES_DB=${POSTGRES_DB:-mizano_db}
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mizano-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mizano} -d ${POSTGRES_DB:-mizano_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: mizano-redis
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
      - REDISCLI_AUTH=${REDIS_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}
    # Array form: the password stays one argv entry, never split by a shell
    # (a single quote in it is the only character YAML cannot carry here).
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}}',
        '--appendonly',
        'yes',
        '--maxmemory',
        '256mb',
        '--maxmemory-policy',
        'allkeys-lru',
      ]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    volumes:
      - redis_data:/data
    networks:
      - mizano-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================
  # Nginx Reverse Proxy (Optional)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: mizano-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
      - api
    networks:
      - mizano-network

  # ============================================
  # Certbot — SSL certificate management
  # ============================================
  certbot:
    image: certbot/certbot
    container_name: mizano-certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    profiles:
      - with-nginx

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_certs:
    driver: local
  certbot_www:
    driver: local


# ============================================
# Networks
# ============================================
networks:
  mizano-network:
    driver: bridge
